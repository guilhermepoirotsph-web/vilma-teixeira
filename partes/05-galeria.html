<!-- Galeria: só aparece quando existir foto (painel → Site → Galeria, ou
     fotos/galeria-1.jpg … galeria-6.jpg). Sem foto, a seção nem entra na tela. -->
<section class="secao claro galeria" id="fotos" hidden>
  <div class="wrap wrap--largo">
    <div class="galeria__cabeca">
      <div>
        <p class="olho revelar">Vilma em Caraguá</p>
        <h2 class="h1 revelar">Onde o mandato<br><span class="grifo">acontece.</span></h2>
      </div>
      <a class="btn btn--vazado revelar" href="https://www.instagram.com/vereadoravilma/"
         target="_blank" rel="noopener" data-ig-link>Mais fotos no Instagram ↗</a>
    </div>
    <div class="galeria__grade" id="galeria-grade"></div>
  </div>

  <dialog class="lupa" id="galeria-lupa" aria-label="Foto ampliada">
    <img alt="Foto ampliada da galeria" id="galeria-lupa-img">
    <button class="lupa__fechar" type="button" aria-label="Fechar">×</button>
  </dialog>
</section>
