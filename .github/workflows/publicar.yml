# ============================================================================
#  Publica o site no GitHub Pages a cada push na main.
#
#  O repositório guarda tudo; a hospedagem recebe só `_site/`, montada pelo
#  `publicar.mjs` — que também aborta se encontrar segredo no material.
#  Antes de publicar, as provas do site rodam: build quebrado não vai ao ar.
# ============================================================================
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:      # botão "Run workflow" na aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicação por vez; se chegar push novo no meio, o antigo é descartado
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  provar:
    name: Provar antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # o banco roda em PGlite: Postgres de verdade, sem serviço externo
      - name: Provas do banco (RLS, papéis, LGPD)
        run: node banco/provar-sql.mjs

      # Chrome de verdade para as provas do site
      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      # provar.mjs abre o site num Chrome de verdade: sem servidor no ar ele
      # bate em localhost:8803 e falha. O `&` deixa o processo vivo para os
      # passos seguintes; o laço espera a porta em vez de dormir um número
      # arbitrário de segundos.
      - name: Subir o servidor de prévia
        run: |
          node montar.mjs
          node preview-server.mjs &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8803/ > /dev/null; then
              echo "prévia no ar em $i s"; exit 0
            fi
            sleep 1
          done
          echo "::error::o servidor de prévia não subiu em 40 s"; exit 1

      - name: Provas do site
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node ferramentas/provar.mjs

      - name: Provas da publicação (pacote e rede de segredo)
        run: node ferramentas/provar-publicacao.mjs

      # inclui a trava que impede um fluxo de mandar WhatsApp para eleitor
      - name: Provas dos fluxos do n8n
        run: node ferramentas/provar-n8n.mjs

  publicar:
    name: Publicar no Pages
    needs: provar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Montar _site/
        run: node publicar.mjs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
